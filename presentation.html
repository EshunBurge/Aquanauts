<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aquanauts Pitch Deck</title>
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-text-size-adjust:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#deck{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;visibility:hidden;user-select:none;-webkit-user-select:none;will-change:transform,opacity}
.slide.on{visibility:visible}
.slide img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#vid{position:absolute;left:53.40%;top:16.83%;width:36.14%;height:74.12%;object-fit:cover;object-position:top;background:#000;cursor:pointer}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5;opacity:0;transition:opacity .3s;pointer-events:none}
#ui{opacity:1}
#ui button,#ui a{pointer-events:auto;font:700 14px Inter,Arial,sans-serif;color:#EAF4F5;background:rgba(15,26,32,.88);border:2px solid #1c3a43;border-radius:99px;min-width:44px;height:40px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
#ui button:hover,#ui a:hover{border-color:#99DCE1}
#ui button:disabled{opacity:.35;cursor:default}
#ui .ct{pointer-events:none;font:800 13px Inter,Arial,sans-serif;letter-spacing:.14em;color:#99DCE1;min-width:56px;text-align:center}
#bar{position:fixed;left:0;top:0;height:3px;background:#F58A53;width:0;transition:width .3s;z-index:6}
.hit{position:fixed;top:0;bottom:56px;width:22%;z-index:3;cursor:pointer;-webkit-tap-highlight-color:transparent}
#hp{left:0}#hn{right:0}
@media(max-width:520px){#ui a span{display:none}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="deck">
<div class="slide on" data-i="0"><img src="media/deck/s-1.jpg" alt="Slide 1 of 7" draggable="false"></div>
<div class="slide" data-i="1"><img src="media/deck/s-2.jpg" alt="Slide 2 of 7" draggable="false"></div>
<div class="slide" data-i="2"><img src="media/deck/s-3.jpg" alt="Slide 3 of 7" draggable="false" loading="lazy"></div>
<div class="slide" data-i="3"><img src="media/deck/s-4.jpg" alt="Slide 4 of 7" draggable="false" loading="lazy"></div>
<div class="slide" data-i="4"><img src="media/deck/s-5.jpg" alt="Slide 5 of 7" draggable="false" loading="lazy"><video id="vid" src="media/deck/board-video.mp4" poster="media/deck/board-poster.jpg" muted loop playsinline preload="auto"></video></div>
<div class="slide" data-i="5"><img src="media/deck/s-6.jpg" alt="Slide 6 of 7" draggable="false" loading="lazy"></div>
<div class="slide" data-i="6"><img src="media/deck/s-7.jpg" alt="Slide 7 of 7" draggable="false" loading="lazy"></div>
</div></div>
<div id="ui"><button id="pv" aria-label="Previous slide">&larr;</button><span class="ct" id="ct"></span><button id="nx" aria-label="Next slide">&rarr;</button><button id="fs" aria-label="Full screen">Full screen</button><a href="media/deck/Aquanauts-Pitch-Deck.pdf" target="_blank" rel="noopener" download aria-label="Download the PDF">PDF</a></div>
<script>
(function(){
  var s=[].slice.call(document.querySelectorAll('.slide')),n=s.length,cur=0,busy=false,D=600,E='cubic-bezier(.4,0,.2,1)',vid=document.getElementById('vid');
  function pre(i){var im=s[i]&&s[i].querySelector('img');if(im&&im.loading==='lazy')im.loading='eager'}
  function vplay(on){if(!vid)return;if(on){vid.currentTime=0;var p=vid.play();if(p&&p.catch)p.catch(function(){})}else vid.pause()}
  function ui(){document.getElementById('ct').textContent=(cur+1)+' / '+n;document.getElementById('bar').style.width=((cur+1)/n*100)+'%';
    document.getElementById('pv').disabled=cur===0;document.getElementById('nx').disabled=cur===n-1;
    try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
  function set(i){cur=i;s.forEach(function(e,k){e.classList.toggle('on',k===cur)});pre(cur);pre(cur+1);pre(cur-1);vplay(cur===4);ui()}
  function go(i){
    i=Math.max(0,Math.min(n-1,i));if(i===cur||busy)return;
    var from=s[cur],to=s[i],fwd=i>cur;pre(i);
    var kind=(fwd?i:cur)===1?'fade':'push';/* slide 2 fades; slides 3-7 push left */
    var d=fwd?1:-1,A,B;
    if(kind==='fade'){A=[{opacity:1},{opacity:0}];B=[{opacity:0},{opacity:1}]}
    else{A=[{transform:'translateX(0)'},{transform:'translateX('+(-100*d)+'%)'}];B=[{transform:'translateX('+(100*d)+'%)'},{transform:'translateX(0)'}]}
    to.classList.add('on');busy=true;cur=i;ui();vplay(cur===4);
    if(from===s[4]&&vid)setTimeout(function(){if(cur!==4)vid.pause()},D);
    var o={duration:D,easing:E,fill:'both'};
    if(!from.animate){from.classList.remove('on');busy=false;return}
    var a1=from.animate(A,o),a2=to.animate(B,o);
    a2.onfinish=function(){from.classList.remove('on');a1.cancel();a2.cancel();busy=false;s.forEach(function(e,k){e.classList.toggle('on',k===cur)})};
  }
  var h=parseInt((location.hash||'').slice(1),10);set(isNaN(h)?0:Math.max(0,Math.min(n-1,h-1)));
  document.getElementById('nx').onclick=function(){go(cur+1)};
  document.getElementById('pv').onclick=function(){go(cur-1)};
  addEventListener('keydown',function(e){
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].indexOf(e.key)>-1){e.preventDefault();go(cur+1)}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(e.key)>-1){e.preventDefault();go(cur-1)}
    else if(e.key==='Home')go(0);else if(e.key==='End')go(n-1);else if(e.key==='f'||e.key==='F')tfs();});
  if(vid)vid.addEventListener('click',function(e){e.stopPropagation();vid.paused?vid.play():vid.pause()});
  var x0=null;addEventListener('touchstart',function(e){document.body.classList.add('touch');x0=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1));x0=null},{passive:true});
  function tfs(){var d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{var r=el.requestFullscreen||el.webkitRequestFullscreen;if(r)r.call(el)}}
  var fb=document.getElementById('fs');if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))fb.style.display='none';fb.onclick=tfs;
})();
</script>
</body>
</html>
