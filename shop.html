<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — Aquanauts</title>
<meta name="description" content="Shop the Aquanauts game board and plush crew.">
<meta name="theme-color" content="#05070a">
<script>if('scrollRestoration' in history)history.scrollRestoration='manual';</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=20261115i">
</head>
<body data-page="shop">
<main>
  <section class="store-hero">
    <div class="wrap">
      <span class="eyebrow rise">Shop</span>
      <h1 class="rise" style="animation-delay:.1s">The Aquanauts <span>shop</span></h1>
      <p class="lead rise" style="animation-delay:.2s">A game board for the family table and a soft plush for every crew member.</p>
      <ul class="store-perks rise" style="animation-delay:.3s"><li>Free shipping over $75</li><li>Ships in 3 to 5 business days</li><li>30-day returns</li></ul>
    </div>
  </section>
  <section class="store">
    <div class="wrap">
      <div class="store-bar">
        <div class="s-tabs" role="group" aria-label="Filter products">
          <button class="s-tab on" type="button" data-f="all" aria-pressed="true">All <b></b></button>
          <button class="s-tab" type="button" data-f="board" aria-pressed="false">Game board <b></b></button>
          <button class="s-tab" type="button" data-f="plush" aria-pressed="false">Plush crew <b></b></button>
        </div>
        <div class="s-tools"><span id="sCount" class="s-count"></span>
          <label class="s-sort">Sort <select id="sSort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="az">Name: A to Z</option></select></label>
          <button class="linkish" type="button" data-open-cart>Cart (<span id="cartCount">0</span>)</button></div>
      </div>
      <div class="p-grid" id="pGrid"></div>
    </div>
  </section>
</main>
<script src="js/shop-data.js?v=20261115i"></script>
<script src="js/shop.js?v=20261115i"></script>
<script src="js/main.js?v=20261115i"></script>
</body>
</html>
