<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My dashboard · Aquanauts</title>
<meta name="theme-color" content="#05070a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=20261115d">
<link rel="stylesheet" href="css/dashboard.css?v=20261115d">
<script>(function(){var d=document.documentElement,f=function(){d.classList.toggle("tall",self!==top&&innerHeight>1000&&innerWidth>900)};f();addEventListener("resize",f)})()</script>
<style id="sticky-fix">html body{overflow:visible!important}html{overflow-x:clip}@media(min-width:901px){.side{position:sticky;top:0;align-self:start}}</style>
</head>
<body data-page="dash">
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="index.html" aria-label="Aquanauts home">Aquanauts<i></i></a>
    <nav class="snav" id="snav" aria-label="Dashboard"></nav>
    <button class="logout" id="logout" type="button"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M16 8l4 4-4 4M20 12H9"/></svg><span>Log out</span></button>
  </aside>
  <div class="main">
    <header class="top">
      <div class="top-l"><h1 id="pageTitle">Control center</h1></div>
      <div class="top-r">
        <div class="pill streak" id="streakPill" title="Days in a row"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4.5 3-7 1 1.500 2 2 3 2 0-2-.5-4 0-6z"/></svg><b id="streakNum">0</b></div>
        <div class="pill coins" id="coinPill" title="Your coins"><span class="ci" id="coinIco"></span><b id="coinNum">0</b></div>
        <button class="me" id="meBtn" type="button" aria-label="My profile"><img id="meImg" src="img/pufferfish.png" alt=""></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div class="modal" id="modal" aria-hidden="true"><div class="m-card" role="dialog" aria-modal="true" id="mCard"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="js/three.min.js"></script>
<script src="js/pets.js?v=20261115d"></script>
<script src="js/prizes-data.js?v=20261115d"></script>
<script src="js/firebase-config.js?v=20261115d"></script>
<script src="js/aq-backend.js?v=20261115d"></script>
<script src="js/dashboard.js?v=20261115d"></script>
</body>
</html>
