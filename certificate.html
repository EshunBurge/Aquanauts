<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aquanauts Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070a;--card:#0f1820;--line:#1f2e38;--aqua:#99dce1;--orange:#f58a53;--text:#eef6f7;--muted:#8da0a6;--ease:cubic-bezier(.2,.8,.2,1)}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding:clamp(16px,3vw,40px);-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{max-width:1180px;margin:0 auto}
.brand{font-family:'Anton',Impact,sans-serif;font-size:2rem;letter-spacing:.02em;color:var(--aqua);text-transform:uppercase}.brand i{display:inline-block;width:.2em;height:.2em;background:var(--orange);margin-left:.04em}
.controls{display:grid;grid-template-columns:1fr 1fr auto auto;gap:14px;align-items:end;margin:22px 0 30px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px}
label{display:grid;gap:6px;font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--aqua)}
input,select{height:52px;border-radius:12px;border:2px solid var(--line);background:#0a1319;color:var(--text);font:600 1rem 'Inter',sans-serif;padding:0 16px;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--aqua)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 24px;font:800 .85rem 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border:2px solid var(--bg);border-radius:12px;background:var(--orange);color:#0a0603;box-shadow:5px 5px 0 var(--aqua);cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--aqua)}
.btn.ghost{background:transparent;color:var(--aqua);border-color:var(--aqua);box-shadow:none}.btn.ghost:hover{background:var(--aqua);color:#031012;transform:none}
.fit{width:100%;max-width:1100px;margin:0 auto;position:relative;overflow:hidden;aspect-ratio:1100/850;container-type:inline-size}
#cert{position:absolute;top:0;left:0;width:1100px;height:850px;transform-origin:0 0;transform:scale(min(1,tan(atan2(100cqw,1100px))));background:#99dce1;font-family:'Inter',sans-serif;color:#0b1b20}
.paper{position:absolute;inset:28px;background:#fbf6ec;border-radius:26px}
.edge{position:absolute;inset:50px;border:3px solid #f58a53;border-radius:14px}
.c-brand{position:absolute;top:76px;left:0;right:0;text-align:center;font-family:'Anton',sans-serif;font-size:26px;letter-spacing:.12em;color:#0b1b20}.c-brand i{display:inline-block;width:6px;height:6px;background:#f58a53;margin-left:3px}
.c-title{position:absolute;top:136px;left:0;right:0;text-align:center;font-family:'Anton',sans-serif;font-size:88px;line-height:1;letter-spacing:.1em;padding-left:.1em;color:#0b1b20;text-transform:uppercase}
.c-sub{position:absolute;top:240px;left:0;right:0;text-align:center;font-weight:800;font-size:20px;letter-spacing:.42em;color:#f58a53;padding-left:.42em}
.c-pre{position:absolute;top:292px;left:0;right:0;text-align:center;font-size:20px;color:#4a5b61}
.c-name{position:absolute;top:318px;left:140px;right:140px;height:104px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Anton',sans-serif;font-size:84px;line-height:1.1;color:#0b1b20;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.c-rule{position:absolute;top:428px;left:200px;right:200px;height:4px;background:#0b1b20;border-radius:2px}
.c-for{position:absolute;top:462px;left:0;right:0;text-align:center;font-size:20px;color:#4a5b61}
.c-course{position:absolute;top:500px;left:90px;right:90px;height:64px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap}
.c-course span{display:inline-block;padding:8px 30px 6px;background:#99dce1;border:3px solid #0b1b20;border-radius:14px;box-shadow:6px 6px 0 #f58a53;font-family:'Anton',sans-serif;font-size:40px;line-height:1.2;letter-spacing:.04em;text-transform:uppercase;color:#0b1b20}
.sig{position:absolute;top:606px;width:250px;text-align:center}
.sig .ink{height:84px;display:flex;align-items:flex-end;justify-content:center;border-bottom:2.5px solid #0b1b20}.sig .ink img{max-height:80px;max-width:230px}
.sig b{display:block;margin-top:8px;font-family:'Anton',sans-serif;font-weight:400;font-size:22px;letter-spacing:.06em;color:#0b1b20;text-transform:uppercase}
.sig span{display:block;font-size:13px;font-weight:800;letter-spacing:.16em;color:#f58a53;text-transform:uppercase}
.sig.l{left:150px}.sig.r{right:150px}
.seal{position:absolute;top:586px;left:50%;margin-left:-90px;width:180px;height:180px}
.seal svg{width:180px;height:180px}
.seal img{position:absolute;left:50%;top:50%;width:80px;height:80px;object-fit:contain;transform:translate(-50%,-50%)}
@page{size:1100px 850px;margin:0}
@media (max-width:760px){.controls{grid-template-columns:1fr}}
@media (max-width:1100px){.controls{grid-template-columns:1fr 1fr}}
@media print{body{padding:0;background:#99dce1}.noprint{display:none!important}.page{max-width:none}.fit{width:1100px!important;height:850px!important;overflow:visible}#cert{transform:none!important}}
</style></head><body><div class="page">

<button class="btn" id="png" type="button">Download PNG</button>
<button class="btn ghost" id="print" type="button">Print or save PDF</button>

const $=s=>document.querySelector(s),cert=$('#cert'),fit=$('#fit'),nameIn=$('#name'),sel=$('#course');
function shrink(el,box,max,min){el.style.fontSize=max+'px';let s=max;while(el.scrollWidth>box.clientWidth-10&&s>min){s-=2;el.style.fontSize=s+'px'}}
function render(){
  const c=COURSES[+sel.value];$('#cCourse').textContent=c[0];$('#cChar').src=IMG[c[1]];
  const n=(nameIn.value.trim()||'Your Name');$('#cName').textContent=n;
  shrink($('#cName'),$('.c-name'),84,40);shrink($('#cCourse'),$('.c-course'),40,22);
  const q=new URLSearchParams();if(nameIn.value.trim())q.set('name',nameIn.value.trim());q.set('course',+sel.value+1);history.replaceState(null,'','?'+q);
}
function scale(){const k=Math.min(1,fit.clientWidth/1100);cert.style.transform='scale('+k+')';fit.style.height=(850*k)+'px'}
const p=new URLSearchParams(location.search);
let nm=p.get('name');
if(!nm){try{const u=JSON.parse(localStorage.getItem('aq_user')||'null');if(u)nm=[u.first,u.last].filter(Boolean).join(' ')||u.name||''}catch(e){}}
if(nm)nameIn.value=nm;
const ci=parseInt(p.get('course'),10);if(ci>=1&&ci<=COURSES.length)sel.value=ci-1;
nameIn.addEventListener('input',render);sel.addEventListener('change',render);addEventListener('resize',scale);
$('#print').addEventListener('click',()=>print());
$('#png').addEventListener('click',async()=>{
  const old=cert.style.transform;cert.style.transform='none';fit.style.height='850px';
  try{const cv=await html2canvas(cert,{scale:2,backgroundColor:'#99dce1',useCORS:true});const a=document.createElement('a');
    const nm=(nameIn.value.trim()||'certificate').replace(/[^a-z0-9]+/gi,'-').toLowerCase();a.download='aquanauts-'+nm+'.png';a.href=cv.toDataURL('image/png');a.click()}
  finally{cert.style.transform=old;scale()}
});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{render();scale()});
render();scale();
</script></body></html>
